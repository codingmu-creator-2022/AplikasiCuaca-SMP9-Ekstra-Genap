<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Cuaca</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="weather-container">
        <h1><i class="fas fa-cloud-sun"></i> Info Cuaca</h1>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Masukkan nama kota...">
            <button id="searchBtn"><i class="fas fa-search"></i> Cari</button>
        </div>
        
        <div class="weather-result" id="weatherResult">
            <div class="initial-message">
                <p>Masukkan nama kota untuk melihat informasi cuaca</p>
            </div>
        </div>
        
        <div class="loading" id="loading">
            <i class="fas fa-spinner fa-spin"></i> Memuat data...
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
